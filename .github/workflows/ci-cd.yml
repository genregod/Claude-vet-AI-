# Updated CI/CD Workflow

name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Testcontainers Cloud Client
        uses: atomicjar/testcontainers-cloud-setup-action@v1
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/valor-assist-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/valor-assist-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/valor-assist-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/valor-assist-frontend:${{ github.sha }}

      - name: Verification of Backend Docker push
        run: 'echo "Successfully pushed backend image with tags: latest and ${{ github.sha }}"'

      - name: Verification of Frontend Docker push
        run: 'echo "Successfully pushed frontend image with tags: latest and ${{ github.sha }}"'

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to ECS
        run: |
          echo "Deploying with task definition referencing the image: ${{ secrets.DOCKER_USERNAME }}/valor-assist-backend:latest"
          echo "Deploying with task definition referencing the image: ${{ secrets.DOCKER_USERNAME }}/valor-assist-frontend:latest"