name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_BACKEND: valor-assist-backend
  ECR_REPOSITORY_FRONTEND: valor-assist-frontend
  ECS_CLUSTER: valor-assist-prod-cluster
  ECS_SERVICE_BACKEND: valor-assist-prod-backend-svc
  ECS_SERVICE_FRONTEND: valor-assist-prod-frontend-svc
  ECS_TASK_FAMILY_BACKEND: valor-assist-prod-backend
  ECS_TASK_FAMILY_FRONTEND: valor-assist-prod-frontend

jobs:
  # ── Build and Push Docker Images to ECR ───────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-cicd
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ./Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          echo "✅ Backend image pushed: $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG"

      - name: Build, tag, and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            -f ./frontend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          echo "✅ Frontend image pushed: $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG"

  # ── Deploy to AWS ECS ──────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Backend to ECS
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_BACKEND}:latest"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY_BACKEND \
            --region $AWS_REGION \
            --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
             .containerDefinitions[0].image = $IMAGE')
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --region $AWS_REGION \
            --query 'taskDefinition.revision' --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_BACKEND \
            --task-definition "${ECS_TASK_FAMILY_BACKEND}:${REVISION}" \
            --force-new-deployment \
            --region $AWS_REGION
          echo "✅ Backend deployment triggered with ${ECS_TASK_FAMILY_BACKEND}:${REVISION} (image: $IMAGE)"

      - name: Deploy Frontend to ECS
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_FRONTEND}:latest"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY_FRONTEND \
            --region $AWS_REGION \
            --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
             .containerDefinitions[0].image = $IMAGE')
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --region $AWS_REGION \
            --query 'taskDefinition.revision' --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_FRONTEND \
            --task-definition "${ECS_TASK_FAMILY_FRONTEND}:${REVISION}" \
            --force-new-deployment \
            --region $AWS_REGION
          echo "✅ Frontend deployment triggered with ${ECS_TASK_FAMILY_FRONTEND}:${REVISION} (image: $IMAGE)"

      - name: Wait for Backend to stabilize
        run: |
          echo "⏳ Waiting for backend to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE_BACKEND" \
            --region "$AWS_REGION"
          echo "✅ Backend stable"

      - name: Wait for Frontend to stabilize
        run: |
          echo "⏳ Waiting for frontend to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE_FRONTEND" \
            --region "$AWS_REGION"
          echo "✅ Frontend stable"

      - name: Deployment complete
        run: |
          echo "🚀 Deployment of backend and frontend to valor-assist-prod-cluster complete!"