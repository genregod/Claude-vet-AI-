# Updated CI/CD Workflow

name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            myrepo/backend:latest
            myrepo/backend:${{ github.sha }}
            myrepo/frontend:latest
            myrepo/frontend:${{ github.sha }}

      - name: Verification of Backend Docker push
        run: 'echo "Successfully pushed backend image with tags: latest and ${{ github.sha }}"'

      - name: Verification of Frontend Docker push
        run: 'echo "Successfully pushed frontend image with tags: latest and ${{ github.sha }}"'

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to ECS
        run: |
          echo "Deploying with task definition referencing the image: myrepo/backend:latest"
          echo "Deploying with task definition referencing the image: myrepo/frontend:latest"
