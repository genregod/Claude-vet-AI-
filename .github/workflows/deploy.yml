name: Deploy to ECS
on:
  push:
    branches: [main]

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Backend to ECS
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_BACKEND}:latest"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY_BACKEND \
            --region $AWS_REGION \
            --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
             .containerDefinitions[0].image = $IMAGE')
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --region $AWS_REGION \
            --query 'taskDefinition.revision' --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_BACKEND \
            --task-definition "${ECS_TASK_FAMILY_BACKEND}:${REVISION}" \
            --force-new-deployment \
            --region $AWS_REGION
          echo "✅ Backend deployment triggered with ${ECS_TASK_FAMILY_BACKEND}:${REVISION} (image: $IMAGE)"

      - name: Deploy Frontend to ECS
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_FRONTEND}:latest"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY_FRONTEND \
            --region $AWS_REGION \
            --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
             .containerDefinitions[0].image = $IMAGE')
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --region $AWS_REGION \
            --query 'taskDefinition.revision' --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_FRONTEND \
            --task-definition "${ECS_TASK_FAMILY_FRONTEND}:${REVISION}" \
            --force-new-deployment \
            --region $AWS_REGION
          echo "✅ Frontend deployment triggered with ${ECS_TASK_FAMILY_FRONTEND}:${REVISION} (image: $IMAGE)"
